<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Lyrova</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="appearance">
  <div class="ambient" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

  <div class="app">
    <!-- ══ Sidebar ══ -->
    <nav class="sidebar glass">
      <div class="brand drag">
        <img src="../../../assets/icon.png" alt="" class="brand-icon">
        <div><b>Lyrova</b><small id="version"></small></div>
      </div>
      <button class="nav" data-page="appearance"><span class="ico"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h7M3 12h9"/></svg></span><span data-i18n="nav.appearance"></span></button>
      <button class="nav" data-page="background"><span class="ico"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2.5 11l3.5-3 3 2.5 2-1.5 2.5 2"/></svg></span><span data-i18n="nav.background"></span></button>
      <button class="nav" data-page="effects"><span class="ico"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 9h2l1.5-4 3 8L10 7l1 2h3"/></svg></span><span data-i18n="nav.effects"></span></button>
      <button class="nav" data-page="clock"><span class="ico"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M8 4.6V8l2.2 1.5"/></svg></span><span data-i18n="nav.clock"></span></button>
      <button class="nav" data-page="screens"><span class="ico"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M6 14h4M8 11v3"/></svg></span><span data-i18n="nav.screens"></span></button>
      <button class="nav" data-page="system"><span class="ico"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4"/></svg></span><span data-i18n="nav.system"></span></button>
      <div class="spacer"></div>
      <p class="fine" data-i18n="settings.saved"></p>
    </nav>

    <main class="content">
      <!-- ════ Appearance ════ -->
      <section class="page" data-page="appearance">
        <header class="head drag"><h1 data-i18n="appearance.title"></h1><p data-i18n="appearance.subtitle"></p></header>
        <h2 data-i18n="appearance.style"></h2>
        <div class="group">
          <div class="tiles" data-key="lyricsStyle">
            <button class="tile" data-value="column"><span class="thumb m-column"><i></i><i></i><i></i></span><b data-i18n="style.column"></b></button>
            <button class="tile" data-value="spread"><span class="thumb m-spread"><i></i><i></i><i></i></span><b data-i18n="style.spread"></b></button>
            <button class="tile" data-value="karaoke"><span class="thumb m-karaoke"><i></i></span><b data-i18n="style.karaoke"></b></button>
            <button class="tile" data-value="word"><span class="thumb m-word">Takt</span><b data-i18n="style.word"></b></button>
            <button class="tile" data-value="pixel"><span class="thumb m-pixel">pixel</span><b data-i18n="style.pixel"></b></button>
            <button class="tile" data-value="typewriter"><span class="thumb m-typewriter">tipp<i></i></span><b data-i18n="style.typewriter"></b></button>
            <button class="tile" data-value="neon"><span class="thumb m-neon">Neon</span><b data-i18n="style.neon"></b></button>
          </div>
        </div>
        <div class="group">
          <label class="row"><span class="lbl" data-i18n="appearance.font"></span><select id="fontFamily"></select></label>
          <label class="row"><span class="lbl" data-i18n="appearance.size"></span><input type="range" id="fontSize" min="0.6" max="1.8" step="0.05"><output for="fontSize"></output></label>
          <div class="row"><span class="lbl" data-i18n="appearance.textColor"></span><div class="swatches" data-key="textColor"></div></div>
          <div class="row"><span class="lbl" data-i18n="appearance.accentColor"></span><div class="swatches" data-key="accentColor"></div></div>
          <div class="row"><span class="lbl" data-i18n="appearance.position"></span>
            <div class="seg" data-key="position">
              <button data-value="center" data-i18n="appearance.position.center"></button>
              <button data-value="left" data-i18n="appearance.position.left"></button>
              <button data-value="top" data-i18n="appearance.position.top"></button>
              <button data-value="bottom" data-i18n="appearance.position.bottom"></button>
            </div>
          </div>
          <label class="row"><span class="lbl"><span data-i18n="appearance.songInfo"></span><small data-i18n="appearance.songInfo.hint"></small></span><input type="checkbox" class="switch" id="showSongInfo"></label>
        </div>
        <div class="group">
          <label class="row"><span class="lbl"><span data-i18n="appearance.offset"></span><small data-i18n="appearance.offset.hint"></small></span><input type="range" id="offsetMs" min="-5000" max="5000" step="250"><output for="offsetMs"></output></label>
          <div class="row"><span class="lbl"></span><button class="pill" id="offset-reset" data-i18n="appearance.offset.reset"></button></div>
          <div class="row"><span class="lbl"><span data-i18n="appearance.cache"></span><small data-i18n="appearance.cache.hint"></small></span><button class="pill" id="cache-clear" data-i18n="appearance.cache.clear"></button></div>
        </div>
        <p class="status" id="cache-status" role="status"></p>
      </section>

      <!-- ════ Background (lyrics screen) ════ -->
      <section class="page" data-page="background" hidden>
        <header class="head drag"><h1 data-i18n="background.title"></h1><p data-i18n="background.subtitle"></p></header>
        <div class="group">
          <div class="tiles bg-tiles" data-key="background" data-target="lyrics"></div>
          <div class="row"><span class="lbl"><span data-i18n="background.image"></span><small class="file-state" data-file="backgroundImage"></small></span><button class="pill" data-pick="image" data-target="lyrics" data-i18n="background.choose"></button></div>
          <div class="row"><span class="lbl"><span data-i18n="background.video"></span><small class="file-state" data-file="backgroundVideo"></small></span><button class="pill" data-pick="video" data-target="lyrics" data-i18n="background.choose"></button></div>
          <label class="row"><span class="lbl"><span data-i18n="background.dim"></span><small data-i18n="background.dim.hint"></small></span><input type="range" id="backgroundDim" min="0" max="0.85" step="0.05"><output for="backgroundDim"></output></label>
        </div>
        <p class="status bg-status" role="status"></p>
      </section>

      <!-- ════ Effects ════ -->
      <section class="page" data-page="effects" hidden>
        <header class="head drag"><h1 data-i18n="effects.title"></h1><p data-i18n="effects.subtitle"></p></header>
        <div class="group">
          <div class="row"><span class="lbl" data-i18n="effects.level"></span><div class="meter"><i id="meter"></i></div></div>
          <label class="row"><span class="lbl" data-i18n="effects.glow"></span><input type="range" id="glowAmount" min="0" max="2" step="0.1"><output for="glowAmount"></output></label>
          <label class="row"><span class="lbl" data-i18n="effects.pulse"></span><input type="range" id="pulseAmount" min="0" max="2" step="0.1"><output for="pulseAmount"></output></label>
          <label class="row"><span class="lbl" data-i18n="effects.particles"></span><input type="range" id="particlesAmount" min="0" max="2" step="0.1"><output for="particlesAmount"></output></label>
          <label class="row"><span class="lbl" data-i18n="effects.shake"></span><input type="range" id="shakeAmount" min="0" max="2" step="0.1"><output for="shakeAmount"></output></label>
        </div>
        <div class="group">
          <label class="row"><span class="lbl" data-i18n="effects.edge"></span><input type="range" id="edgeAmount" min="0" max="2" step="0.1"><output for="edgeAmount"></output></label>
          <div class="row"><span class="lbl" data-i18n="effects.edgeColor"></span><div class="swatches" data-key="edgeColor"></div></div>
        </div>
        <p class="status warn" id="audio-status" hidden data-i18n="effects.noAudio"></p>
      </section>

      <!-- ════ Clock screen ════ -->
      <section class="page" data-page="clock" hidden>
        <header class="head drag"><h1 data-i18n="clock.title"></h1><p data-i18n="clock.subtitle"></p></header>
        <h2 data-i18n="clock.style"></h2>
        <div class="group">
          <div class="tiles" data-key="clockStyle">
            <button class="tile" data-value="modern"><span class="thumb c-modern">21:47</span><b data-i18n="clock.style.modern"></b></button>
            <button class="tile" data-value="glass"><span class="thumb c-glass"><span>21:47</span></span><b data-i18n="clock.style.glass"></b></button>
            <button class="tile" data-value="flip"><span class="thumb c-flip"><i>21</i><i>47</i></span><b data-i18n="clock.style.flip"></b></button>
            <button class="tile" data-value="analog"><span class="thumb c-analog"><span></span></span><b data-i18n="clock.style.analog"></b></button>
            <button class="tile" data-value="words"><span class="thumb c-words"><span>halb <b>zehn</b></span></span><b data-i18n="clock.style.words"></b></button>
            <button class="tile" data-value="pixel"><span class="thumb c-pixel">21:47</span><b data-i18n="clock.style.pixel"></b></button>
            <button class="tile" data-value="neon"><span class="thumb c-neon">21:47</span><b data-i18n="clock.style.neon"></b></button>
          </div>
          <div class="row"><span class="lbl" data-i18n="clock.color"></span><div class="swatches" data-key="clockColor"></div></div>
          <label class="row"><span class="lbl" data-i18n="clock.size"></span><input type="range" id="clockSize" min="0.5" max="1.8" step="0.05"><output for="clockSize"></output></label>
          <div class="row wrap"><span class="lbl" data-i18n="clock.position"></span>
            <div class="seg" data-key="clockPosition">
              <button data-value="top-left" data-i18n="clock.pos.top-left"></button>
              <button data-value="top-right" data-i18n="clock.pos.top-right"></button>
              <button data-value="center" data-i18n="clock.pos.center"></button>
              <button data-value="bottom-left" data-i18n="clock.pos.bottom-left"></button>
              <button data-value="bottom-right" data-i18n="clock.pos.bottom-right"></button>
            </div>
          </div>
        </div>
        <div class="group">
          <label class="row"><span class="lbl" data-i18n="clock.greeting"></span><input type="checkbox" class="switch" id="clockGreeting"></label>
          <label class="row"><span class="lbl" data-i18n="clock.date"></span><input type="checkbox" class="switch" id="clockDate"></label>
          <label class="row"><span class="lbl" data-i18n="clock.seconds"></span><input type="checkbox" class="switch" id="clockSeconds"></label>
          <label class="row"><span class="lbl"><span data-i18n="clock.songCard"></span><small data-i18n="clock.songCard.hint"></small></span><input type="checkbox" class="switch" id="clockSongCard"></label>
          <label class="row"><span class="lbl" data-i18n="clock.lyricLine"></span><input type="checkbox" class="switch" id="clockLyricLine"></label>
          <div class="row top"><label class="lbl" for="clockText"><span data-i18n="clock.text"></span><small data-i18n="clock.text.hint"></small></label><textarea id="clockText" rows="3" maxlength="500"></textarea></div>
        </div>
        <h2 data-i18n="clock.background"></h2>
        <div class="group">
          <div class="tiles bg-tiles" data-key="clockBackground" data-target="clock"></div>
          <div class="row"><span class="lbl"><span data-i18n="background.image"></span><small class="file-state" data-file="clockBackgroundImage"></small></span><button class="pill" data-pick="image" data-target="clock" data-i18n="background.choose"></button></div>
          <div class="row"><span class="lbl"><span data-i18n="background.video"></span><small class="file-state" data-file="clockBackgroundVideo"></small></span><button class="pill" data-pick="video" data-target="clock" data-i18n="background.choose"></button></div>
        </div>
        <p class="status bg-status" role="status"></p>
        <p class="note" data-i18n="clock.rolesHint"></p>
      </section>

      <!-- ════ Displays ════ -->
      <section class="page" data-page="screens" hidden>
        <header class="head drag"><h1 data-i18n="screens.title"></h1><p data-i18n="screens.subtitle"></p></header>
        <div class="group map-group"><div class="screen-map" id="screen-map"></div></div>
        <div class="group" id="display-list"></div>
        <div class="group">
          <div class="row"><span class="lbl" data-i18n="screens.mode"></span><span class="value" id="mode"></span></div>
        </div>
      </section>

      <!-- ════ System ════ -->
      <section class="page" data-page="system" hidden>
        <header class="head drag"><h1 data-i18n="system.title"></h1><p data-i18n="system.subtitle"></p></header>
        <div class="group">
          <label class="row"><span class="lbl"><span data-i18n="system.autostart"></span><small id="autostart-hint" data-i18n="system.autostart.dev" hidden></small></span><input type="checkbox" class="switch" id="autostart"></label>
          <label class="row"><span class="lbl"><span data-i18n="system.fullscreen"></span><small data-i18n="system.fullscreen.hint"></small></span><input type="checkbox" class="switch" id="pauseOnFullscreen"></label>
          <label class="row"><span class="lbl"><span data-i18n="system.battery"></span><small data-i18n="system.battery.hint"></small></span><input type="checkbox" class="switch" id="throttleOnBattery"></label>
          <div class="row"><span class="lbl" data-i18n="system.fps"></span>
            <div class="seg" data-key="fps"><button data-value="30">30 fps</button><button data-value="60">60 fps</button></div>
          </div>
          <label class="row"><span class="lbl" data-i18n="system.updates"></span><input type="checkbox" class="switch" id="autoUpdate"></label>
          <label class="row"><span class="lbl" data-i18n="system.language"></span><select id="language"><option value="de">Deutsch</option><option value="en">English</option></select></label>
        </div>
        <div class="group">
          <div class="row"><span class="lbl" id="version-row"></span><button class="pill" id="open-log" data-i18n="system.log"></button></div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
